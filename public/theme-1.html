<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Masjid Display - Modern UI Theme</title>
  <link rel="stylesheet" href="theme-1.css">
</head>

<body id="index-body" class="theme-1">

  <div class="container">

    <!-- Top Date Bar -->
    <div class="top-date-box">
      <div id="date" class="date-left text-blue"></div>
      <div id="hijri" data-format="simple" class="date-right text-purple"></div>
    </div>

    <!-- Kalima -->
    <div class="arabic-title text-blue">
      لا إِلَهَ إِلَّا اللَّهُ مُحَمَّدٌ رَّسُولُ اللهِ
    </div>

    <!-- Live Time Card -->
    <div class="live-time-card card">
      <div class="live-time-label">लाइव टाइम</div>
      
      <div class="clock-display">
        <span id="hours" class="clock-gradient"></span>
        <div class="clock-sec-ampm">
          <span id="seconds" class="clock-cyan"></span>
          <span id="ampm" class="clock-purple"></span>
        </div>
      </div>

      <div class="live-time-footer">
        <div class="footer-col">
          <div class="footer-label">अगली</div>
          <div id="nextPrayerName" data-format="simple" class="text-blue footer-value prayer-name-override"></div>
        </div>
        <div class="footer-col">
          <div class="footer-label">बाक़ी वक़्त</div>
          <div id="nextPrayerCountdown" class="text-purple footer-value">
            <span id="countHours">00</span> :
            <span id="countMinutes">00</span> :
            <span id="countSeconds">00</span>
          </div>
        </div>
        <div class="footer-col">
          <div class="footer-label">सहरी / इफ़्तार</div>
          <div class="text-blue footer-value">
            <span id="sahriTime" data-format="simple"></span> &middot; <span id="iftarTime" data-format="simple"></span>
          </div>
        </div>
      </div>
    </div>

    <!-- Prayer Cards -->
    <div id="prayerCards" class="prayer-cards-container">
      <!-- Generated by app.js -->
    </div>

    <!-- Extra Prayers -->
    <div class="extra-prayers-grid">
      <div class="extra-card">
        <div class="extra-label" id="currentPrayerLabel">असर आख़िर</div>
        <div id="currentPrayerEndTime" class="text-blue extra-time"></div>
      </div>
      <div class="extra-card">
        <div class="extra-label" id="nextPrayerLabel">मग़रिब शुरू</div>
        <div id="nextPrayerStartTime" class="text-blue extra-time"></div>
      </div>
      <div class="extra-card">
        <div class="extra-label">तहज्जुद</div>
        <div id="tahajjudTime" class="text-blue extra-time"></div>
      </div>
      <div class="extra-card">
        <div class="extra-label">इश्राक़</div>
        <div id="ishraqTime" class="text-blue extra-time"></div>
      </div>
      <div class="extra-card">
        <div class="extra-label">चाश्त</div>
        <div id="chashtTime" class="text-blue extra-time"></div>
      </div>
    </div>

    <!-- Juma Section -->
    <div class="juma-row card">
      <div class="juma-title">जुमा</div>
      <div class="juma-times">
        <div class="juma-time-box">
          <div class="juma-label">अज़ान</div>
          <div class="text-blue juma-val" id="jumaAzanTime">01:00</div>
        </div>
        <div class="juma-time-box">
          <div class="juma-label">ख़ुत्बा</div>
          <div class="text-blue juma-val" id="jumaKhutbaTime">01:45</div>
        </div>
        <div class="juma-time-box">
          <div class="juma-label">जमाअत</div>
          <div class="text-blue juma-val" id="jumaJamatTime">02:00</div>
        </div>
      </div>
    </div>

    <!-- Verse Slider Section -->
    <div class="verse-slider-container" style="display:none;">
      <div id="verseSliderContent" class="verse-slider-content">
        <span id="verseText" class="verse-text"></span>
      </div>
    </div>

    <!-- Footer -->
    <footer class="footer">
      <div id="timingChangeMarquee" class="timing-change-marquee" style="display:none;">
        <span id="timingChangeText"></span>
      </div>
    </footer>

  </div>

  <audio id="beepSound" preload="auto">
    <source src="audio/beep_long.wav" type="audio/wav" muted>
  </audio>

  <script src="utils.js"></script>
  <script src="app.js"></script>
</body>

</html>
