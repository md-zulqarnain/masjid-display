<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Surah & Hadith Screen</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&family=Amiri:ital,wght@0,400;0,700;1,400;1,700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">

    <style>
        .container {
            height: 100vh;
            display: flex;
            flex-direction: column;
            padding: 20px;
        }

        .header {
            text-align: center;
        }

        .kalima {
            font-size: 40px;
            margin: 10px 0;
            color: gold;
        }

        .time {
            font-size: 60px;
            font-weight: bold;
            color: gold;
        }

        .date {
            font-size: 18px;
            opacity: 0.8;
        }

        .separator {
            height: 1px;
            background: gold;
            margin: 20px 0;
        }

        .content {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        .badge {
            border: 1px solid gold;
            padding: 5px 15px;
            margin-bottom: 20px;
            font-size: 14px;
            letter-spacing: 3px;
        }

        .content {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            overflow: hidden;
            /* important */
        }

        .arabic {
            width: 92%;
            height: 58%;
            max-height: 58%;
            font-weight: bold;
            line-height: 1.8;
            direction: rtl;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            color: #ffffff;
            /* Important */
            overflow: hidden;
            word-wrap: break-word;
            overflow-wrap: break-word;
            white-space: normal;
            /* Font will be controlled by JavaScript */
            font-size: 60px;
        }

        .reference {
            margin-top: 20px;
            font-size: 3.5vw;
            color: gold;
        }

        .referenceEn {
            font-size: 3vw;
            opacity: 0.7;
        }

        .fade {
            transition: opacity 0.6s ease;
        }

        .hidden {
            opacity: 0;
        }
    </style>
</head>

<body>
    <div class="background-layer"></div>
    <div class="container">
        <!-- Top Arabic Header -->
        <!-- Top Arabic Header -->
        <div class="top-bar">
            <img src="images/roza.webp" class="corner-img">
            <img src="images/kalima.png" style="max-width: 52%;">
            <img src="images/kaaba.webp" class="corner-img ">
        </div>

        <!-- Clock Section -->
        <div id="clock" style="margin-top: 2vh;">
            <div class="clock-time">
                <!-- temp badge moved to date-row for consistent placement -->
                <span id="hours"></span>
                <span id="seconds"></span>
                <span id="ampm"></span>
                <!-- humidity removed for BMP-only setups -->
            </div>
            <div class="date-row">
                <span class="sensor-inline-left" id="sensor-left"><span class="s-label"><svg class="temp-icon"
                            viewBox="0 0 24 24" aria-hidden="true">
                            <path d="M14 14.76V5a4 4 0 0 0-8 0v9.76a6 6 0 1 0 8 0Z" fill="none" stroke="currentColor"
                                stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
                            <path d="M10 5v10" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
                            <circle cx="10" cy="18" r="2.5" fill="currentColor" />
                        </svg></span><span class="s-value" id="sensor-temp-left">-- °C</span></span>
                <div id="date" class="date-left"></div>
            </div>
        </div>

        <!-- NEXT PRAYER COUNTDOWN BAR (Theme-3 Style) -->
        <section id="nextPrayer" class="countdown-bar card animate-soft-glow">
          <div class="countdown-bar-content">
            <div class="prayer-info">
              <div id="nextPrayerName"></div>
            </div>
            <div id="nextPrayerCountdown" class="countdown-timer">
              <span id="countHours" class="countdown-num">00</span>
              <span class="countdown-colon">:</span>
              <span id="countMinutes" class="countdown-num">00</span>
              <span class="countdown-colon">:</span>
              <span id="countSeconds" class="countdown-num">00</span>
            </div>
          </div>
        </section>

        <!-- FULL WIDTH HIJRI & SAHRI/IFTAR BAR -->
        <section class="hijri-ramadan-bar card">
          <div class="hijri-part">
            <div id="hijri"></div>
          </div>
          <div class="ramadan-part">
            <div class="ramadan-time-box">
              <span class="ramadan-label">सहरी</span>
              <span id="sahriTime" data-format="simple" class="ramadan-val">--:--</span>
            </div>
            <div class="ramadan-time-box">
              <span class="ramadan-label">इफ़्तार</span>
              <span id="iftarTime" data-format="simple" class="ramadan-val">--:--</span>
            </div>
          </div>
        </section>

        <div class="divider">
            <div class="divider-line"></div>
            <div class="divider-star">✦</div>
            <div class="divider-line"></div>
        </div>


        <div class="content fade" id="content">
            <div class="badge" id="type"></div>
            <!-- <div class="verse-section">
                <h2 id="verseReference"></h2>
                <p id="verseText"></p>
            </div> -->
            <div class="arabic" id="verseText"></div>
            <div class="divider divider-small">
                <div class="divider-line"></div>
                <div class="divider-star">❁</div>
                <div class="divider-line"></div>
            </div>
            <div class="reference" id="verseReference"></div>

            <div class="referenceEn" id="referenceEn"></div>
        </div>
        <footer class="footer">
            <p>जामा मस्जिद झिरन्या शेख</p>
            <div class="brand-log">
                <img src="images/logo.png" />
            </div>
        </footer>
    </div>
    <audio id="beepSound" preload="auto">
        <source src="audio/beep_long.wav" type="audio/wav" muted>
    </audio>
    <script src="utils.js"></script>
    <script src="app.js"></script>
    <script src="sensor.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const observer = new MutationObserver(() => {
                observer.disconnect();

                const prayerEl = document.querySelector("#nextPrayerName .prayer");
                const prefixEl = document.querySelector("#nextPrayerName .prefix.card-heading");

                if (prayerEl) {
                    const text = prayerEl.textContent.toLowerCase();
                    let englishName = "";
                    if (text.includes("fajr") || text.includes("फ़जर") || text.includes("फजर") || text.includes("फ़ज्र")) {
                        englishName = "Fajr";
                    } else if (text.includes("zuhr") || text.includes("dhuhr") || text.includes("ज़ोهر") || text.includes("ज़ोहर") || text.includes("जोहर") || text.includes("ज़ोहर")) {
                        englishName = "Zuhr";
                    } else if (text.includes("asr") || text.includes("असर")) {
                        englishName = "Asr";
                    } else if (text.includes("maghrib") || text.includes("मग़रिब") || text.includes("मगरिब") || text.includes("मग़रिब")) {
                        englishName = "Maghrib";
                    } else if (text.includes("isha") || text.includes("इशा") || text.includes("ईशा")) {
                        englishName = "Isha";
                    } else if (text.includes("juma") || text.includes("जुमा")) {
                        englishName = "Juma";
                    }

                    if (!englishName) {
                        englishName = prayerEl.textContent.replace(/^[-\s]+/, "").trim();
                    }

                    const hindiTranslations = {
                        "Fajr": "फ़ज्र",
                        "Zuhr": "ज़ोहर",
                        "Asr": "असर",
                        "Maghrib": "मग़रिब",
                        "Isha": "इशा",
                        "Juma": "जुमा"
                    };
                    const hindiName = hindiTranslations[englishName] || englishName;

                    const prefixText = prefixEl ? prefixEl.textContent : "";
                    let labelType = "अगली नमाज़";
                    if (prefixText.includes("जमाअत") || prefixText.includes("जमात") || prefixText.includes("Jamaat")) {
                        labelType = "अगली जमाअत";
                    } else if (prefixText.includes("अज़ान") || prefixText.includes("Azan")) {
                        labelType = "अगली अज़ान";
                    }

                    const nameContainer = document.getElementById("nextPrayerName");
                    if (nameContainer) {
                        nameContainer.innerHTML = `
              <span class="prefix card-heading">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-clock w-4 h-4 text-gold">
                  <circle cx="12" cy="12" r="10"></circle>
                  <polyline points="12 6 12 12 16 14"></polyline>
                </svg>
                ${labelType}
              </span>
              <span class="prayer">
                ${hindiName}
              </span>
            `;
                    }
                }

                const target = document.getElementById("nextPrayerName");
                if (target) {
                    observer.observe(target, { childList: true, subtree: true });
                }
            });

            const target = document.getElementById("nextPrayerName");
            if (target) {
                observer.observe(target, { childList: true, subtree: true });
            }
        });
    </script>
    <!-- floating sensor widget removed; inline badges used beside clock -->
    <script>

        let verses = [];
        let verseQueue = [];
        let slideTimer = null;
        const content = document.getElementById("content");

        function shuffleArray(items) {
            const shuffled = [...items];
            for (let i = shuffled.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
            }
            return shuffled;
        }

        function getNextVerse() {
            if (!verseQueue.length) {
                verseQueue = shuffleArray(verses);
            }
            return verseQueue.shift();
        }

        async function loadVersesFromServer() {
            try {
                const res = await fetch('/api/verses');
                verses = await res.json();

                if (!verses.length) {
                    document.getElementById("verseText").innerText = "No content available";
                    return;
                }

                verseQueue = shuffleArray(verses);
                updateVerse();
                // setInterval(updateVerse, 15000);

            } catch (err) {
                console.error("Error loading verses:", err);
            }
        }


        function fitText() {
            const el = document.getElementById("verseText");

            // Start with a large font
            let fontSize = 100;

            // Minimum font size
            const minFontSize = 24;

            el.style.fontSize = fontSize + "px";

            // Force browser to calculate layout
            void el.offsetHeight;

            /*
             * Reduce font size until the complete text fits
             * inside both width and height.
             */
            while (
                (el.scrollHeight > el.clientHeight ||
                    el.scrollWidth > el.clientWidth) &&
                fontSize > minFontSize
            ) {
                fontSize -= 1;
                el.style.fontSize = fontSize + "px";
            }

            /*
             * Try to increase the font slightly again.
             * This makes sure small text uses as much
             * available space as possible.
             */
            while (fontSize < 100) {
                const testSize = fontSize + 1;
                el.style.fontSize = testSize + "px";

                if (
                    el.scrollHeight > el.clientHeight ||
                    el.scrollWidth > el.clientWidth
                ) {
                    el.style.fontSize = fontSize + "px";
                    break;
                }

                fontSize = testSize;
            }
        }

        function updateVerse() {

            // ✅ Clear previous timer (IMPORTANT)
            if (slideTimer) {
                clearTimeout(slideTimer);
            }

            content.classList.add("hidden");

            setTimeout(() => {

                const current = getNextVerse();
                if (!current) {
                    return;
                }

                document.getElementById("type").innerText =
                    current.type.toUpperCase();

                document.getElementById("verseText").innerText =
                    current.text;

                document.getElementById("verseReference").innerText =
                    current.reference;

                document.getElementById("referenceEn").innerText = "";

                content.classList.remove("hidden");

                fitText();

                // 🔥 Better Word Count (removes extra spaces)
                const wordCount = current.text.trim().split(/\s+/).length;

                let displayTime = 4000 + (wordCount * 350);

                displayTime = Math.max(5000, displayTime);
                displayTime = Math.min(40000, displayTime);

                // ✅ Store timeout reference
                slideTimer = setTimeout(updateVerse, displayTime);

            }, 600);
        }

        window.addEventListener("load", loadVersesFromServer);
        window.addEventListener("resize", fitText);
    </script>

</body>

</html>
